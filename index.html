<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnet nutrition</title>
<meta name="theme-color" content="#14181d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f3f6;--card:#fff;--card2:#f6f7f9;--ink:#13151a;--mute:#7c828d;--line:#e6e8ed;--acc:#3b82f6;--acc2:#f59e0b;--kcal:#3b82f6;--p:#f0577a;--f:#f4b13e;--c:#2fbf8a;--fib:#9a7cf6;--danger:#ef4444;--shadow:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0c0e12;--card:#16191f;--card2:#1d2129;--ink:#f1f3f6;--mute:#8b919c;--line:#262a33;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;background:var(--bg);padding:14px 18px 8px;display:flex;align-items:center;gap:8px;z-index:5}
#syncDot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
#syncDot.ok{background:var(--c)}#syncDot.busy{background:var(--acc2)}#syncDot.err{background:var(--danger)}
header h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0;flex:1}
.pill{border:0;background:var(--card);color:var(--acc);font-weight:600;font-size:13px;padding:7px 12px;border-radius:999px;box-shadow:var(--shadow)}
main{padding:4px 14px 12px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:15px;font-weight:700;margin:0 0 10px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:9px 0 11px;border:0;background:none;color:var(--mute);font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--ink);font-weight:700}
nav button.on svg{stroke:var(--acc)}
.ck{width:36px;height:36px;flex:none;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent;font-weight:800;font-size:17px}
.entry.on .ck{background:var(--acc);border-color:var(--acc);color:#fff}
.entry.on{background:color-mix(in srgb,var(--acc) 7%,transparent);margin:0 -16px;padding-left:16px;padding-right:16px}
.entry{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pick{border:0;background:none;padding:0;margin:-6px;padding:6px;cursor:pointer;flex:none;border-radius:14px}
.pick:active .fi{transform:scale(.92)}
#selbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.08);padding:10px 12px calc(12px + env(safe-area-inset-bottom));display:none}
#selbar.on{display:block}
#selbar .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700}
#selbar .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#selbar .acts .btn{padding:11px 4px;font-size:14px}
body.selmode nav,body.selmode #fab{display:none!important}
body.selmode{padding-bottom:130px}
.jtools{display:flex;gap:4px;flex-wrap:wrap}
#fab{position:fixed;right:18px;bottom:80px;width:58px;height:58px;border-radius:50%;border:0;background:var(--acc);color:#fff;box-shadow:0 8px 24px rgba(59,130,246,.45);z-index:7;display:flex;align-items:center;justify-content:center}
#fab svg{width:28px;height:28px}
button{font:inherit;cursor:pointer}
.btn{border:0;background:var(--card2);color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:600}
.btn.pri{background:var(--acc);color:#fff}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:999px}
.btn.danger{color:var(--danger)}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
input,select,textarea{font:inherit;padding:11px 12px;border:1px solid transparent;border-radius:12px;background:var(--card2);color:var(--ink);width:100%;outline:none}
input:focus,select:focus{border-color:var(--acc)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc)}
label{font-size:12px;font-weight:500;color:var(--mute);display:block;margin-bottom:4px}
.mute{color:var(--mute);font-size:13px}
.xs{font-size:11.5px}
.big{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0 8px}
.bar i{display:block;height:100%;border-radius:4px}
/* semaine */
.week{display:flex;align-items:center;gap:2px;margin:0 0 12px}
.wd{flex:1;border:0;background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:14px}
.wd span{font-size:11px;font-weight:600}
.wd b{font-size:15px;font-weight:700;color:var(--ink);width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.wd.today b{color:var(--acc)}
.wd.on b{background:var(--ink);color:var(--bg)}
.wd i{width:5px;height:5px;border-radius:50%}
.wd i.dot{background:var(--acc)}
.wk-nav{border:0;background:none;color:var(--mute);font-size:22px;padding:0 4px}
/* tableau de bord */
.hero-top{display:flex;align-items:center;gap:18px}
.ring-b,.ring-s{position:relative;flex:none}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-s .ring-in b{font-size:13px;font-weight:700}
.hero-side{flex:1;display:flex;flex-direction:column;gap:10px}
.hero-side>div{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:7px}
.hero-side>div:last-child{border:0;padding:0}
.hero-side b{font-size:17px;font-weight:700}
.macs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.mac{display:flex;flex-direction:column;align-items:center;gap:2px}
.mac-l{font-size:12px;font-weight:600;margin-top:4px}
.wcard{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
.pill-in{display:flex;align-items:center;gap:6px;background:var(--card2);border-radius:12px;padding:0 12px 0 0;width:118px}
.pill-in input{background:none;text-align:right;font-weight:700;font-size:17px;padding:9px 0 9px 10px}
/* journal */
.meal{margin-bottom:14px}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 6px 6px;font-weight:700;font-size:15px}
.list{padding:4px 16px}
.entry{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line);gap:10px;cursor:pointer}
.list .entry:first-child{border-top:0}
.e-name{font-weight:600;font-size:14.5px;line-height:1.25}
.e-right{text-align:right;flex:none}
.e-right b{font-size:15px}
.chips{display:flex;gap:7px;font-size:11.5px;font-weight:600;justify-content:flex-end;margin-top:2px}
.wcard2{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:12px 16px}
.pill-in.sm{width:104px}.pill-in.sm input{font-size:16px;padding-left:8px}
.meas{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.meas input{padding:8px;text-align:right}
.remind{border-left:4px solid var(--acc)}
.mh-tot{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--mute);font-weight:500}
.mh-tot b{color:var(--ink);font-size:14px}
.mh-tot .chips{margin:0}
.mbtn{border:0;background:var(--card);color:var(--mute);border-radius:999px;width:30px;height:24px;font-size:16px;line-height:1;box-shadow:var(--shadow)}
.fibbtn{display:flex;align-items:center;gap:12px;width:100%;border:0;padding:10px 14px;color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.fib-it{display:flex;justify-content:space-between;gap:10px;align-items:center}
.chip{display:inline-block;border:0;background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--acc);font-weight:600;font-size:13px;padding:8px 12px;border-radius:999px;margin:12px 6px 0 0}
textarea{min-height:110px;resize:vertical;font-size:15px}
.add-in{border:0;background:none;color:var(--acc);font-weight:600;padding:12px 0;width:100%;text-align:left}
/* feuilles */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;z-index:20;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheetbox{position:relative;background:var(--card);width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;border-radius:24px 24px 0 0;overflow:hidden;animation:up .22s ease-out}
#sheetIn{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:8px 18px calc(28px + env(safe-area-inset-bottom))}
.sheet{overscroll-behavior:contain;touch-action:pan-y}
body.lock{overflow:hidden;touch-action:none}
body.lock .sheet{touch-action:auto}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h3{margin:2px 0 12px;font-size:20px;font-weight:800;letter-spacing:-.01em;padding-right:44px}
.sx{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:0;background:var(--card2);color:var(--ink);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2}
.fi{width:36px;height:36px;flex:none;border-radius:11px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1}
.irow{display:flex;align-items:center;gap:12px;min-width:0}
.irow>div:last-child{min-width:0}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tiles.t3{grid-template-columns:repeat(3,1fr)}
.tile{border:0;background:var(--card2);color:var(--ink);border-radius:16px;padding:13px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;font-weight:600}
.ing{display:grid;grid-template-columns:1fr 78px 30px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ing input{padding:7px 8px;text-align:right}
.ing .x{border:0;background:none;color:var(--danger);font-size:20px}
.tile svg{width:26px;height:26px;stroke:var(--acc)}
.it{padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.it>div:first-child{font-weight:600;font-size:14.5px}
video{width:100%;border-radius:16px;background:#000;max-height:45vh;object-fit:cover}
svg text{fill:var(--mute);font-size:11px;font-family:Inter,system-ui,sans-serif}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;display:none;z-index:40;max-width:90vw}
table{width:100%;border-collapse:collapse;font-size:13.5px}td,th{padding:8px 3px;border-bottom:1px solid var(--line);text-align:right}td:first-child,th:first-child{text-align:left}th{color:var(--mute);font-weight:600;font-size:12px}
tr:last-child td{border-bottom:0}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
.ai-row{display:grid;grid-template-columns:22px 1fr 64px;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ai-row .n{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;grid-column:2/4}
.ai-row input{padding:7px;font-size:13px}
.stat{display:flex;justify-content:space-between;align-items:flex-end}
</style>
</head>
<body>
<header>
  <h1 id="title">Journal</h1>
  <button class="pill" id="todayBtn">Aujourd'hui</button>
  <span id="syncDot" title="Synchronisation"></span>
</header>
<main id="main"></main>
<nav>
  <button data-tab="journal" class="on"></button>
  <button data-tab="poids"></button>
  <button data-tab="depense"></button>
  <button data-tab="reglages"></button>
</nav>
<button id="fab" aria-label="Ajouter"></button>
<div id="selbar"><div class="top"><span id="selCount"></span><span class="row" style="gap:6px"><button class="btn sm" id="selAll">Tout</button><button class="btn sm" id="selCancel">Annuler</button></span></div>
  <div class="acts"><button class="btn danger" id="selDel">Supprimer</button><button class="btn" id="selCopy">Copier…</button><button class="btn pri" id="selMove">Déplacer…</button></div></div>
<div class="sheet" id="sheet"><div class="sheetbox"><button class="sx" id="sx" aria-label="Fermer">×</button><div id="sheetIn"></div></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileJson" accept="application/json,.json" hidden>
<input type="file" id="fileMF" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv,application/octet-stream" hidden>
<input type="file" id="filePhoto" accept="image/*" capture="environment" hidden>

<script>
/* ===================== Données ===================== */
const KEY = 'carnet-nutrition-v1';
const MEALS = ['Petit-déjeuner', 'Déjeuner', 'Collations', 'Dîner'];
const MEAL_HOUR = { 'Petit-déjeuner': '08:00', 'Déjeuner': '12:30', 'Collations': '16:30', 'Dîner': '19:30' };
// Mensurations (cm), côté droit pour les membres. mf = colonne de l'export MacroFactor « Body Metrics »
const MEAS = [
  { k: 'taille', l: 'Tour de taille (nombril)', mf: 'waist' }, { k: 'hanches', l: 'Hanches', mf: 'hips' },
  { k: 'poitrine', l: 'Poitrine', mf: 'chest' }, { k: 'epaules', l: 'Épaules', mf: 'shoulders' }, { k: 'cou', l: 'Cou', mf: 'neck' },
  { k: 'bras', l: 'Bras', mf: 'right bicep' }, { k: 'avantbras', l: 'Avant-bras', mf: 'right forearm' }, { k: 'poignet', l: 'Poignet', mf: 'right wrist' },
  { k: 'cuisse', l: 'Cuisse', mf: 'right thigh' }, { k: 'mollet', l: 'Mollet', mf: 'right calf' }, { k: 'cheville', l: 'Cheville', mf: 'right ankle' }
];
// Icône d'un aliment d'après son nom (français ou anglais), pour se repérer d'un coup d'œil
const FOOD_ICONS = [
  [/whey|prot[ée]ine en poudre|proteina|protein powder|isolat|casein/i, '💪'], [/psyllium|chia|graines?|seeds?|\blin\b|flax/i, '🌱'],
  [/pomme de terre|patate|potato|frites?|fries|pur[ée]e/i, '🥔'], [/pain au chocolat|croissant|viennoiserie|brioche/i, '🥐'],
  [/œuf|oeuf|\begg/i, '🥚'], [/banan/i, '🍌'], [/\bpommes?\b|apple|compote/i, '🍎'], [/poire|pear/i, '🍐'],
  [/orange|cl[ée]mentine|mandarine|clementine/i, '🍊'], [/fraise|framboise|myrtille|berr|cassis|m[uû]re/i, '🍓'],
  [/raisin|grape/i, '🍇'], [/kiwi/i, '🥝'], [/p[êe]che|abricot|prune|nectarine|peach|plum|apricot/i, '🍑'], [/melon|past[èe]que|cantaloupe/i, '🍈'],
  [/mangue|mango|ananas|pineapple|passion/i, '🥭'], [/avocat|avocado/i, '🥑'], [/citron|lemon|lime/i, '🍋'],
  [/skyr|yaourt|yogh?o?urt|fromage blanc|faisselle|petit suisse|fjord|quark/i, '🥛'], [/\blait\b|milk/i, '🥛'],
  [/fromage|cheese|emmental|comt[ée]|mozzarella|feta|parmesan|camembert|ch[èe]vre/i, '🧀'], [/beurre|butter/i, '🧈'],
  [/flocons?|avoine|oat|muesli|granola|porridge|c[ée]r[ée]ales|cereal/i, '🥣'],
  [/riz|rice|risotto/i, '🍚'], [/p[âa]tes|pasta|spaghetti|penne|tagliatelle|macaroni|fusilli|nouilles|noodle|carbonara|lasagn/i, '🍝'],
  [/pizza/i, '🍕'], [/burger/i, '🍔'], [/sandwich|wrap|panini|kebab|tacos?|burrito/i, '🥪'],
  [/\bpain\b|bread|baguette|tranche|toast|biscotte|bagel/i, '🍞'],
  [/poulet|chicken|dinde|turkey|volaille|kip\b/i, '🍗'], [/b[œo]euf|beef|steak|viande|hach[ée]|veau|agneau|porc|jambon|lardon|bacon|saucisse|sausage|ham\b/i, '🥩'],
  [/poisson|fish|colin|saumon|salmon|thon|tuna|cabillaud|sardine|maquereau|crevette|shrimp|cod/i, '🐟'],
  [/haricots? verts?|petits? pois|artichaut|asperge|fenouil/i, '🥦'],
  [/lentille|haricot|pois chiche|pois cass|bean|dahl|dal\b|chickpea|split pea|f[èe]ve/i, '🫘'],
  [/soupe|soup|velout[ée]|curry|stew|rago[uû]t|chili|pot-au-feu/i, '🍲'], [/salade|salad/i, '🥗'],
  [/carotte|carrot/i, '🥕'], [/tomate|tomato/i, '🍅'], [/brocoli|chou|courgette|haricots verts|[ée]pinard|l[ée]gume|vegetable|poireau|leek|champignon|mushroom|poivron|pepper|concombre|cucumber|aubergine|oignon|onion/i, '🥦'],
  [/chocolat|choc|nutella|cacao|cocoa|m&m|snickers|kinder/i, '🍫'],
  [/ma[ïi]s|corn/i, '🌽'], [/cacahu[èe]te|peanut|amande|almond|noix|nut|noisette|pistache|cajou|cashew/i, '🥜'],
  [/biscuit|cookie|sabl[ée]|g[âa]teau sec|barre|bar\b|cracker/i, '🍪'],
  [/g[âa]teau|cake|tarte|cr[êe]pe|gaufre|dessert|cr[èe]me|flan|pancake|muffin|brownie|glace|ice cream/i, '🍰'],
  [/miel|honey|confiture|jam|sirop|sucre|sugar/i, '🍯'], [/huile|oil|olive|vinaigrette|mayonnaise|sauce/i, '🫒'],
  [/caf[ée]|coffee|espresso|cappuccino/i, '☕'], [/th[ée]\b|tea\b|tisane|infusion/i, '🍵'], [/vin\b|wine|bi[èe]re|beer|cidre|ap[ée]ritif/i, '🍷'],
  [/jus|juice|soda|coca|limonade|boisson|drink|smoothie/i, '🧃']
];
function foodIcon(name, isRecipe) { const n = String(name || ''); for (const [re, ic] of FOOD_ICONS) if (re.test(n)) return ic; return isRecipe ? '🍲' : '🍽️'; }
const fi = (name, isRecipe) => `<span class="fi">${foodIcon(name, isRecipe)}</span>`;
const DAYS_FR = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const OFF_FIELDS = 'code,product_name,product_name_fr,brands,nutriments,serving_quantity';

function defaults() {
  return {
    settings: {
      rate: -0.25,          // kg / semaine visé
      goalKcal: 0,          // 0 = calculé automatiquement
      proteinG: 140, fatG: 60, fiberG: 30,
      initialTDEE: 2500,    // utilisé tant qu'il n'y a pas assez de données
      alpha: 0.1,           // lissage du poids (moyenne mobile exponentielle)
      window: 28,           // jours utilisés pour estimer la dépense
      smooth: 0.9,          // lissage de la dépense (0 = aucun)
      kcalPerKg: 7000,      // réglages calés sur l'historique MacroFactor (écart moyen ≈ 38 kcal)
      apiKey: '', model: 'claude-sonnet-5-5',
      measDay: 0, measTime: '09:00', journalView: 'repas' // rappel mensurations : 0 = dimanche, 6 = samedi, -1 = désactivé
    },
    days: {},   // 'AAAA-MM-JJ' -> {entries:[], weight:null}

// Recherche : sans accents, chaque mot doit correspondre ; quelques équivalents anglais pour les aliments importés de MacroFactor
const norm = t => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/œ/g, 'oe').replace(/[^a-z0-9%]+/g, ' ').trim();
const SYN = { banane: 'banana', amande: 'almond', pomme: 'apple', oeuf: 'egg', poulet: 'chicken', riz: 'rice', lait: 'milk', fromage: 'cheese', pain: 'bread', avoine: 'oat', noix: 'walnut', pates: 'pasta', saumon: 'salmon', thon: 'tuna', boeuf: 'beef', poire: 'pear', fraise: 'strawberr', framboise: 'raspberr', myrtille: 'blueberr', raisin: 'grape', carotte: 'carrot', tomate: 'tomato', brocoli: 'broccoli', epinard: 'spinach', champignon: 'mushroom', yaourt: 'yogurt', patate: 'potato', dinde: 'turkey', crevette: 'shrimp', chocolat: 'chocolate', miel: 'honey', beurre: 'butter', huile: 'oil', graine: 'seed', noisette: 'hazelnut', cacahuete: 'peanut', haricot: 'bean', lentille: 'lentil', avocat: 'avocado', concombre: 'cucumber', oignon: 'onion', poireau: 'leek', clementine: 'clementine', peche: 'peach', cerise: 'cherr', ananas: 'pineapple', mangue: 'mango', cabillaud: 'cod', jambon: 'ham', sucre: 'sugar', jus: 'juice', biere: 'beer', vin: 'wine' };
function matchScore(name, q) {
  const n = norm(name), words = norm(q).split(' ').filter(Boolean); if (!words.length) return 0;
  const nw = n.split(' ');
  let score = 0;
  for (const w of words) {
    const stem = w.replace(/s$/, ''), syn = SYN[stem] || SYN[w];
    const hit = x => x && (nw.some(t => t.startsWith(x)) ? 1 : n.includes(x) ? 2 : 0);
    const h = Math.min(...[hit(w), hit(stem), hit(syn)].filter(Boolean).concat([9]));
    if (h === 9) return null;
    score += h;
  }
  if (n === norm(q) || n.replace(/s$/, '') === norm(q).replace(/s$/, '')) score -= 3;
  else if (n.startsWith(norm(q))) score -= 1;
  return score + nw.length * 0.15 + n.length * 0.005;   // les noms courts (aliment brut) d'abord
}
function rankFoods(list, q, max = 30) {
  if (!q) return list.slice(0, max);
  return list.map(f => [f, matchScore(f.name, q)]).filter(x => x[1] !== null).sort((a, b) => a[1] - b[1]).slice(0, max).map(x => x[0]);
}

  const pool = { base: BASE_FOODS, mine: S.foods, rec: recentFoods(400, 365), off: [], rcp: ingDraft ? [] : S.recipes };
  let shown = {}, offQ = '', timer = null, ctrl = null, seq = 0;
  const show = () => {
    const q = $('#q').value.trim();
    shown = { rcp: rankFoods(pool.rcp, q, 5), base: q ? rankFoods(pool.base, q, 8) : [], mine: rankFoods(pool.mine, q, q ? 8 : 20), rec: rankFoods(pool.rec, q, q ? 8 : 12), off: q && offQ === q ? rankFoods(pool.off, q, 25) : [] };
    const sec = (title, key, fn) => shown[key].length ? `<label style="margin-top:10px">${title}</label>` + shown[key].map((f, i) => fn(f, i, key)).join('') : '';
    let h = sec('Mes recettes', 'rcp', (r, i) => recipeItem(r, i)) + sec('Aliments de base', 'base', foodItem) + sec('Mes aliments', 'mine', foodItem) + sec('Récents', 'rec', foodItem) + sec('Open Food Facts', 'off', foodItem);
    if (q && q.length >= 3 && offQ !== q) h += '<p class="mute" id="ld">Recherche dans Open Food Facts…</p>';
    $('#res').innerHTML = h || (q ? '<p class="mute">Aucun résultat.</p>' : '<p class="mute">Tape le nom d’un aliment.</p>');
    document.querySelectorAll('#res .it').forEach(el => el.onclick = () => el.dataset.src === 'rcp' ? openRecipeLog(shown.rcp[+el.dataset.i]) : openQty(shown[el.dataset.src][+el.dataset.i]));
  };
  const searchOFF = async q => {
    if (ctrl) ctrl.abort(); ctrl = new AbortController(); const my = ++seq;
    try {
      const u = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=40&lc=fr&cc=fr&fields=${OFF_FIELDS}`;
      const j = await (await fetch(u, { signal: ctrl.signal })).json();
      if (my !== seq) return;
      pool.off = (j.products || []).map(offToFood).filter(f => f.per.kcal != null); offQ = q; show();
    } catch (e) { if (e.name !== 'AbortError' && my === seq) { const l = $('#ld'); if (l) l.textContent = 'Recherche en ligne impossible pour le moment.'; } }
  };
  $('#q').oninput = () => {
    show(); clearTimeout(timer);
    const q = $('#q').value.trim();
    if (q.length >= 3) timer = setTimeout(() => searchOFF(q), 450); else if (ctrl) ctrl.abort();
  };
  $('#q').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#q').blur(); } };
  show(); setTimeout(() => $('#q') && $('#q').focus(), 50);
}

function offToFood(p) {
  const n = p.nutriments || {};
  let kcal = num(n['energy-kcal_100g']); if (kcal == null && num(n.energy_100g) != null) kcal = num(n.energy_100g) / 4.184;
  const brand = p.brands ? ' – ' + String(p.brands).split(',')[0].trim() : '';
  return { name: (p.product_name_fr || p.product_name || 'Produit sans nom') + brand, code: p.code,
    per: { kcal, p: num(n.proteins_100g), c: num(n.carbohydrates_100g), f: num(n.fat_100g), fib: num(n.fiber_100g) },
    serving: num(p.serving_quantity) };
}

/* ---------- Recettes ---------- */
const itemVals = it => it.per && it.grams ? scale(it.per, it.grams) : { kcal: +it.kcal || 0, p: +it.p || 0, c: +it.c || 0, f: +it.f || 0, fib: +it.fib || 0 };
function recipeTotals(r) { const t = { kcal: 0, p: 0, c: 0, f: 0, fib: 0 }; for (const it of r.items) { const v = itemVals(it); for (const x in t) t[x] += v[x]; } return t; }
function recipeWeight(r) { if (r.cooked > 0) return +r.cooked; if (r.items.length && r.items.every(it => it.grams > 0)) return r.items.reduce((s, it) => s + +it.grams, 0); return null; }
function recipePortion(r) { const t = recipeTotals(r), n = Math.max(1, +r.portions || 1), o = {}; for (const x in t) o[x] = t[x] / n; return o; }
function recipeItem(r, i) { const v = recipePortion(r); return `<div class="it irow" data-src="rcp" data-i="${i}">${fi(r.name, true)}<div><div style="font-weight:600;font-size:14.5px">${esc(r.name)}</div><div class="mute">${r0(v.kcal)} kcal / portion · P ${r0(v.p)} · L ${r0(v.f)} · G ${r0(v.c)}${r.portions > 1 ? ' · ' + r.portions + ' portions' : ''}</div></div></div>`; }
function openRecipes() {
  ingDraft = null;
  openSheet(`<h3>Mes recettes</h3>
    ${S.recipes.length ? `<div id="rl">${S.recipes.map((r, i) => recipeItem(r, i)).join('')}</div>` : '<p class="mute">Aucune recette pour l’instant.</p>'}
    <div class="row" style="margin-top:14px"><button class="btn pri" id="newR">+ Nouvelle recette</button><button class="btn" id="close">Fermer</button></div>`);
  document.querySelectorAll('#rl .it').forEach(el => el.onclick = () => openRecipeLog(S.recipes[+el.dataset.i]));
  $('#newR').onclick = () => { ingDraft = { id: uid(), name: '', portions: 1, cooked: null, items: [], isNew: true }; openRecipeEditor(); };
  $('#close').onclick = closeSheet;
}
function openRecipeLog(r) {
  const W = recipeWeight(r), n0 = 1;
  openSheet(`<h3>${esc(r.name)}</h3>
    <div class="mute">${r.items.length} ingrédient${r.items.length > 1 ? 's' : ''} · ${r.portions || 1} portion${r.portions > 1 ? 's' : ''}${W ? ' · ' + r0(W) + ' g au total' : ''}</div>
    <div class="grid2" style="margin:10px 0"><div><label>Portions</label><input id="np" type="number" step="0.25" inputmode="decimal" value="${n0}"></div><div><label>Repas</label>${mealSelect(null)}</div></div>
    <div class="row wrap" style="margin-bottom:8px">${[0.5, 1, 1.5, 2].map(x => `<button class="btn sm" data-np="${x}">${String(x).replace('.', ',')}</button>`).join('')}</div>
    <div id="calc" class="card"></div>
    <div class="row wrap" style="margin-top:10px"><button class="btn pri" id="ok">Ajouter</button><button class="btn" id="edit">Modifier la recette</button><button class="btn" id="cancel">Annuler</button></div>`);
  const per = W ? (() => { const t = recipeTotals(r), o = {}; for (const x in t) o[x] = t[x] * 100 / W; return o; })() : null;
  const vals = () => { const n = num($('#np').value) || 0, v = recipePortion(r), o = {}; for (const x in v) o[x] = v[x] * n; return o; };
  const upd = () => { const v = vals(), n = num($('#np').value) || 0; $('#calc').innerHTML = `<b>${r0(v.kcal)} kcal</b> · P ${r1(v.p)} g · G ${r1(v.c)} g · L ${r1(v.f)} g · Fibres ${r1(v.fib)} g${W ? ` <span class="mute">(${r0(n * W / (r.portions || 1))} g)</span>` : ''}`; };
  $('#np').oninput = upd; upd();
  document.querySelectorAll('[data-np]').forEach(b => b.onclick = () => { $('#np').value = b.dataset.np; upd(); });
  $('#cancel').onclick = closeSheet;
  $('#edit').onclick = () => { ingDraft = JSON.parse(JSON.stringify(r)); openRecipeEditor(); };
  $('#ok').onclick = () => {
    const n = num($('#np').value) || 0; if (!n) return toast('Indique le nombre de portions');
    const g = W ? n * W / (r.portions || 1) : null;
    day(cur).entries.push({ id: uid(), name: r.name, meal: $('#meal').value, time: defaultTime($('#meal').value), recipeId: r.id, portions: n, grams: g, per, ...vals() });
    save(); closeSheet(); toast('Recette ajoutée');
  };
}
function addIngredient(entry) {
  const { meal, id, ...it } = entry;
  ingDraft.items.push(it); openRecipeEditor(); toast('Ingrédient ajouté');
}
function openRecipeEditor() {
  const r = ingDraft, t = recipeTotals(r), W = recipeWeight(r), n = Math.max(1, +r.portions || 1);
  $('#sheetIn').innerHTML = `<div class="grab"></div><h3>${r.isNew ? 'Nouvelle recette' : 'Modifier la recette'}</h3>

    <div id="ings">${r.items.map((it, i) => `<div class="ing"><div><div style="font-weight:600;font-size:14px">${esc(it.name)}</div><div class="mute xs">${r0(itemVals(it).kcal)} kcal</div></div>
      ${it.per ? `<input type="number" inputmode="decimal" data-ig="${i}" value="${r1(it.grams)}">` : `<span class="mute xs" style="text-align:right">${it.grams ? r0(it.grams) + ' g' : 'fixe'}</span>`}<button class="x" data-ix="${i}">×</button></div>`).join('') || '<p class="mute">Ajoute au moins un ingrédient.</p>'}</div>
    <div class="tiles" style="margin-top:10px;grid-template-columns:repeat(4,1fr)"><button class="tile" id="iS">${IC.search}Rechercher</button><button class="tile" id="iB">${IC.scan}Scanner</button><button class="tile" id="iT">${IC.describe}Importer</button><button class="tile" id="iM">${IC.manual}Manuel</button></div>
    <div class="card" style="margin-top:12px;margin-bottom:0"><b>${r0(t.kcal / n)} kcal / portion</b> · P ${r1(t.p / n)} · G ${r1(t.c / n)} · L ${r1(t.f / n)} · Fibres ${r1(t.fib / n)}<div class="mute xs">Total : ${r0(t.kcal)} kcal${W ? ' · ' + r0(W) + ' g' : ''}</div></div>
    <div class="row wrap" style="margin-top:12px"><button class="btn pri" id="rSave">Enregistrer</button>${r.isNew ? '' : '<button class="btn danger" id="rDel">Supprimer</button>'}<button class="btn" id="rCancel">Annuler</button></div>`;
  $('#sheet').classList.add('on');
  $('#rName').oninput = e => r.name = e.target.value;
  $('#rPort').onchange = e => { r.portions = Math.max(1, Math.round(num(e.target.value) || 1)); openRecipeEditor(); };
  $('#rCook').onchange = e => { r.cooked = num(e.target.value) || null; openRecipeEditor(); };
  document.querySelectorAll('[data-ig]').forEach(el => el.onchange = () => { r.items[+el.dataset.ig].grams = num(el.value) || 0; openRecipeEditor(); });
  document.querySelectorAll('[data-ix]').forEach(el => el.onclick = () => { r.items.splice(+el.dataset.ix, 1); openRecipeEditor(); });
  $('#iS').onclick = () => openSearch(); $('#iB').onclick = openScan; $('#iM').onclick = () => openManual(); $('#iT').onclick = openRecipeImport;
  $('#rCancel').onclick = () => { ingDraft = null; openRecipes(); };
  sheetMode = 'editor'; document.body.classList.add('lock');
  if ($('#rDel')) $('#rDel').onclick = () => {
    $('#rDel').outerHTML = '<button class="btn danger" id="rDel2">Confirmer la suppression</button>';
    $('#rDel2').onclick = () => { S.recipes = S.recipes.filter(x => x.id !== r.id); ingDraft = null; save(); openRecipes(); toast('Recette supprimée'); };
  };
  $('#rSave').onclick = () => {
    r.name = $('#rName').value.trim();
    if (!r.name) return toast('Donne un nom à la recette');
    if (!r.items.length) return toast('Ajoute au moins un ingrédient');
    const { isNew, ...clean } = r;
    const i = S.recipes.findIndex(x => x.id === r.id);
    if (i >= 0) S.recipes[i] = clean; else S.recipes.push(clean);
    S.recipes.sort((a, b) => a.name.localeCompare(b.name, 'fr'));
    ingDraft = null; save(); openRecipeLog(clean); toast('Recette enregistrée');
  };
}

/* ---------- Scan code-barres ---------- */
async function openScan() {
  openSheet(`<h3>Scanner un code-barres</h3><video id="vid" playsinline muted></video>
    <p class="mute" id="scanmsg">Vise le code-barres…</p>
    <div class="row"><input id="code" inputmode="numeric" placeholder="ou tape le code"><button class="btn pri" id="go">OK</button></div>
    <p><button class="btn" id="close">Fermer</button></p>`);
  $('#close').onclick = closeSheet;
  $('#go').onclick = () => lookup($('#code').value.trim());
  let Det = window.BarcodeDetector || null;
  try { if (Det && !(await Det.getSupportedFormats()).includes('ean_13')) Det = null; } catch (e) { Det = null; }
  if (!Det) { try { Det = (await import('https://cdn.jsdelivr.net/npm/barcode-detector@2/+esm')).BarcodeDetector; } catch (e) { Det = null; } }
  if (!Det || !navigator.mediaDevices) {
    $('#vid').style.display = 'none';
    $('#scanmsg').textContent = 'Scan automatique indisponible ici. Tape le code à la main.';
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const v = $('#vid'); v.srcObject = stream; await v.play();
    const det = new Det({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] });
    scanning = true;
    const tick = async () => {
      if (!scanning) return;
      try { const r = await det.detect(v); if (r.length) { const c = r[0].rawValue; stopCam(); if (navigator.vibrate) navigator.vibrate(60); return lookup(c); } } catch (e) {}
      setTimeout(tick, 250);
    };
    tick();
  } catch (e) { $('#scanmsg').textContent = 'Caméra inaccessible : ' + e.message; }
}
async function lookup(code) {
  if (!code) return;
  const mine = S.foods.find(f => f.code === code); if (mine) return openQty(mine);
  const m = $('#scanmsg'); if (m) m.textContent = 'Recherche du produit ' + code + '…';
  try {
    const j = await (await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`)).json();
    if (j.status === 1 && j.product) {
      const f = offToFood(j.product);
      if (f.per.kcal == null) { toast('Produit trouvé mais sans valeurs nutritionnelles'); return openManual({ name: f.name }, null, code); }
      return openQty(f);
    }
    openSheet(`<h3>Produit inconnu</h3><p class="mute">Le code ${esc(code)} n’est pas dans Open Food Facts.</p><div class="row"><button class="btn pri" id="man">Saisir à la main</button><button class="btn" id="close">Fermer</button></div>`);
    $('#man').onclick = () => openManual(null, null, code); $('#close').onclick = closeSheet;
  } catch (e) { toast('Connexion impossible : ' + e.message); }
}

function resizeImage(file, max = 1024) {
  return new Promise((res, rej) => {
    const img = new Image(); img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.85).split(',')[1]); URL.revokeObjectURL(img.src);
    }; img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}
async function askAI(content, maxTokens = 2000) {

    method: 'POST',

function chart(dates, sets, unit = '') {
  const W = 600, H = 210, L = 44, R = 8, T = 8, B = 22;
  const ys = sets.flatMap(s => s.v.filter(v => v != null));
  if (!ys.length || dates.length < 2) return '<p class="mute">Pas encore assez de données.</p>';
  let lo = Math.min(...ys), hi = Math.max(...ys); if (hi - lo < 1) { hi += .5; lo -= .5; }
  const pad = (hi - lo) * .08; lo -= pad; hi += pad;
  const X = i => L + (W - L - R) * i / (dates.length - 1), Y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let g = '';
  for (let j = 0; j <= 3; j++) { const v = lo + (hi - lo) * j / 3; g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line);stroke-dasharray:3 4"/><text x="${L - 4}" y="${Y(v) + 4}" text-anchor="end">${hi - lo > 50 ? r0(v) : r1(v)}${unit}</text>`; }

function reminderDue() {

  const now = new Date(), dow = now.getDay();
  // Jour du rappel (après l'heure choisie) ou le lendemain, s'il n'y a pas de mensurations depuis 5 jours
  const [hh, mm] = String(S.settings.measTime || '09:00').split(':').map(Number);
  const isDay = dow === md && (now.getHours() * 60 + now.getMinutes()) >= hh * 60 + mm, isNext = dow === (md + 1) % 7;

/* ---------- Import MacroFactor ---------- */
function toDateKey(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date && !isNaN(v)) return iso(new Date(v.getTime() + 6 * 3600e3));
  if (typeof v === 'number' && v > 20000 && v < 80000) return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10);
  const s = String(v).trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  if ((m = s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})/))) { let a = +m[1], b = +m[2]; const dd = a > 12 ? a : b > 12 ? b : a, mm = a > 12 ? b : b > 12 ? a : b; return `${m[3]}-${String(mm).padStart(2, '0')}-${String(dd).padStart(2, '0')}`; }

}
function decodeEnt(t) { return t.replace(/&(amp|lt|gt|quot|#39|#(\d+));/g, (m, a, n) => n ? String.fromCharCode(+n) : ({ amp: '&', lt: '<', gt: '>', quot: '"', '#39': "'" }[a])); }
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += ch;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows;
}
function mealFromTime(t) { const m = String(t || '').match(/(\d{1,2}):(\d{2})/); if (!m) return 'Collations'; const h = +m[1] + m[2] / 60; return h < 4 ? 'Collations' : h < 11 ? 'Petit-déjeuner' : h < 15 ? 'Déjeuner' : h < 18 ? 'Collations' : 'Dîner'; }
// Journal détaillé MacroFactor (un aliment par ligne : Date, Time, Food Name, …).
// Gère aussi le cas où le .csv a été ouvert puis enregistré dans Excel (tout dans la colonne A).
function mfFoodLog(wb) {
  for (const name of wb.SheetNames) {
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: null });
    if (!aoa.length || !aoa[0]) continue;
    let rows; const first = String(aoa[0][0] ?? '');
    if (/^Date,"?Time"?,"?Food Name/i.test(first)) {
      const text = aoa.filter(r => r && r[0] != null).map(r => r.filter(c => c != null).join(';')).join('\n');
      rows = parseCSV(decodeEnt(text));
    } else if (aoa[0].includes('Food Name') && aoa[0].includes('Time')) rows = aoa;
    else continue;
    const h = rows[0].map(x => String(x ?? '').trim()), I = k => h.indexOf(k);
    const iD = I('Date'), iT = I('Time'), iN = I('Food Name'), iQ = I('Serving Qty'), iG = I('Serving Weight (g)'),
      iK = I('Calories (kcal)'), iF = I('Fat (g)'), iC = I('Carbs (g)'), iP = I('Protein (g)'), iFb = I('Fiber (g)');
    const byDay = {};
    for (const r of rows.slice(1)) {
      const k = toDateKey(r[iD]); if (!k || !r[iN]) continue;
      const g = (num(r[iG]) || 0) * (num(r[iQ]) || 1);
      const vals = { kcal: num(r[iK]) || 0, p: num(r[iP]) || 0, c: num(r[iC]) || 0, f: num(r[iF]) || 0, fib: num(r[iFb]) || 0 };
      (byDay[k] = byDay[k] || []).push({ id: uid(), name: decodeEnt(String(r[iN])), meal: mealFromTime(r[iT]), time: r[iT] || null, grams: g || null, per: g ? scale(vals, 10000 / g) : null, ...vals, src: 'macrofactor' });
    }

  }
  return null;
}

    const data = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true });
    for (let h = 0; h < Math.min(6, data.length); h++) {
      const hdr = (data[h] || []).map(x => String(x ?? '').toLowerCase().trim());
      if (hdr.some(x => x.includes('food name'))) break; // journal détaillé : traité à part
      const di = hdr.findIndex(x => /^(date|jour|day)/.test(x)); if (di < 0) continue;
      const col = (re, not) => hdr.findIndex(x => re.test(x) && !(not && not.test(x)));
      const m = {
        exp: col(/expenditure|dépense|depense|tdee/, NOT),
        trend: col(/trend|tendance/),
        w: col(/weight|poids/, /trend|tendance|target|goal|objectif|lean|maigre/),
        kcal: col(/calorie|energy|énergie|kcal/, /target|goal|objectif|expenditure|budget|dépense/),
        p: col(/^(protein|protéine|proteine)/, NOT), f: col(/^(fat|lipide)s?( \(|$)/, NOT), c: col(/carb|glucide/, NOT), fib: col(/fib/, NOT),
        bf: col(/fat percent|body fat %|masse grasse/, /visual/)
      };
      for (const mm of MEAS) m['meas_' + mm.k] = hdr.findIndex(x => x === mm.mf + ' (cm)');
      const lbs = i => i >= 0 && /lb/.test(hdr[i]) ? 0.45359237 : 1;
      const fw = lbs(m.w), ft = lbs(m.trend);
      let cnt = 0;
      for (let r = h + 1; r < data.length; r++) {
        const row = data[r]; if (!row) continue; const k = toDateKey(row[di]); if (!k) continue;
        const o = rows[k] || (rows[k] = {});
        for (const [key, i] of Object.entries(m)) if (i >= 0) { let v = num(row[i]); if (v == null) continue; if (key === 'w') v *= fw; if (key === 'trend') v *= ft; if (o[key] == null) o[key] = v; }
        cnt++;
      }
      found.push(`${name} (${cnt} lignes : ${Object.entries(m).filter(([, i]) => i >= 0).map(([k]) => k).join(', ')})`);
      break;
    }
  }
  // Recettes MacroFactor : totaux de la recette (le détail des ingrédients n'a pas de quantités dans l'export)
  let nRc = 0;
  for (const name of wb.SheetNames.filter(n => /^recipes$|recettes/i.test(n))) {
    for (const r of XLSX.utils.sheet_to_json(wb.Sheets[name], { defval: null })) {
      const nm = r['Recipe Name'], k = num(r['Calories (kcal)']); if (!nm || k == null || S.recipes.some(x => x.name === nm)) continue;
      const tw = num(r['Total Weight (g)']);
      const vals = { kcal: k, p: num(r['Protein (g)']) || 0, c: num(r['Carbs (g)']) || 0, f: num(r['Fat (g)']) || 0, fib: num(r['Fiber (g)']) || 0 };
      const ings = String(r['Ingredients'] || '').split('\n').map(x => x.trim()).filter(Boolean);
      S.recipes.push({ id: uid(), name: nm, portions: Math.max(1, Math.round(num(r['Serving Qty']) || 1)), cooked: null,
        items: [{ name: 'Total MacroFactor', grams: tw || null, per: tw ? scale(vals, 10000 / tw) : null, ...vals }],
        note: ings.length ? 'Ingrédients dans MacroFactor : ' + ings.join(', ') : '' });
      nRc++;
    }
  }
  // Aliments perso et favoris (valeurs par portion -> pour 100 g)
  let nF = 0;
  for (const name of wb.SheetNames.filter(n => /custom foods|favorites|aliments/i.test(n))) {
    const data = XLSX.utils.sheet_to_json(wb.Sheets[name], { defval: null });
    for (const r of data) {
      const nm = r['Food Name'], g = num(r['Serving Weight (g)']), k = num(r['Calories (kcal)']);
      if (!nm || !g || k == null || S.foods.some(f => f.name === nm) || S.recipes.some(x => x.name === nm)) continue;
      const per = { kcal: k * 100 / g, p: (num(r['Protein (g)']) || 0) * 100 / g, c: (num(r['Carbs (g)']) || 0) * 100 / g, f: (num(r['Fat (g)']) || 0) * 100 / g, fib: num(r['Fiber (g)']) == null ? null : num(r['Fiber (g)']) * 100 / g };
      S.foods.push({ id: uid(), name: nm, per, serving: g }); nF++;
    }
  }
  let nE = 0, nW = 0, nX = 0, nR = 0;
  const log = mfFoodLog(wb);
  if (log) for (const [k, list] of Object.entries(log)) {
    const d = day(k);
    if (d.entries.some(e => e.meal !== 'Import')) continue; // jour déjà saisi dans l'appli : on n'y touche pas
    d.entries = list; nR += list.length;
  }
  if (log) found.push(`journal détaillé (${nR} aliments)`);
  for (const [k, o] of Object.entries(rows)) {
    if (o.exp != null || o.trend != null) { S.mf[k] = { exp: o.exp ?? null, trend: o.trend ?? null }; if (o.exp != null) nX++; }
    if (!fill) continue;
    if (o.kcal != null && o.kcal > 0 && !hasIntake(k) && !(log && log[k])) { day(k).entries.push({ id: uid(), name: 'Import MacroFactor', meal: 'Import', grams: null, per: null, kcal: o.kcal, p: o.p || 0, c: o.c || 0, f: o.f || 0, fib: o.fib || 0 }); nE++; }
    if (o.w != null && (!S.days[k] || S.days[k].weight == null)) { day(k).weight = r1(o.w * 10) / 10; nW++; }
    if (o.bf != null && (!S.days[k] || S.days[k].bf == null)) day(k).bf = o.bf;
    const ms = {}; for (const mm of MEAS) if (o['meas_' + mm.k] != null) ms[mm.k] = o['meas_' + mm.k];
    if (Object.keys(ms).length && !(S.days[k] && S.days[k].meas)) day(k).meas = ms;
  }
  // La première dépense MacroFactor sert de point de départ à l'algorithme
  const firstMF = Object.keys(S.mf).sort().find(k => S.mf[k].exp != null);
  if (firstMF) S.settings.initialTDEE = r0(S.mf[firstMF].exp);
  save(); render();
  openSheet(`<h3>Import terminé</h3><p>${nX} jours de dépense MacroFactor · ${nR ? nR + ' aliments détaillés · ' : ''}${nE} journées d’apports · ${nW} pesées · ${nF} aliments perso · ${nRc} recettes.</p><p class="mute">Feuilles lues : ${esc(found.join(' ; ') || 'aucune colonne « Date » trouvée')}</p><button class="btn pri" id="close">OK</button>`);
  $('#close').onclick = closeSheet;
}

/* ---------- Réglages ---------- */
function renderReglages() {
  const s = S.settings;
  $('#main').innerHTML = `<div class="card"><h2>Objectifs</h2><div class="grid2">
    <div><label>Rythme visé (kg/semaine)</label><input type="number" step="0.05" data-k="rate" value="${s.rate}"></div>
    <div><label>Calories fixes (0 = auto)</label><input type="number" step="10" data-k="goalKcal" value="${s.goalKcal}"></div>
    <div><label>Protéines (g)</label><input type="number" data-k="proteinG" value="${s.proteinG}"></div>
    <div><label>Lipides (g)</label><input type="number" data-k="fatG" value="${s.fatG}"></div>
    <div><label>Fibres (g)</label><input type="number" data-k="fiberG" value="${s.fiberG}"></div>
    <div><label>Dépense initiale (kcal)</label><input type="number" step="10" data-k="initialTDEE" value="${s.initialTDEE}"></div>
    </div><p class="mute">Les glucides prennent le reste des calories.</p></div>
  <div class="card"><h2>Synchronisation GitHub</h2>
    <p class="mute">Tes données sont enregistrées dans un dépôt privé et partagées entre le téléphone et l’ordinateur.</p>
    <div class="grid2"><div><label>Compte</label><input data-cfg="owner" value="${esc(CFG.owner)}" autocapitalize="off"></div><div><label>Dépôt</label><input data-cfg="repo" value="${esc(CFG.repo)}" autocapitalize="off"></div></div>
    <label style="margin-top:8px">Jeton (fine-grained, Contents : lecture et écriture)</label><input type="password" data-cfg="token" value="${esc(CFG.token)}" placeholder="github_pat_…" autocomplete="off">
    <div class="row wrap" style="margin-top:10px"><button class="btn pri" id="syncNow">Synchroniser</button><span class="mute" id="syncInfo">${esc(META.status || (CFG.token ? '' : 'Sur cet appareil seulement'))}</span></div></div>
  ${NATIVE ? `<div class="card"><h2>Appli Android</h2><p class="mute" style="margin-top:0">Version installée : ${UPD.installed ? '1.' + UPD.installed : esc(UPD.name || '?')}${UPD.latest ? ' · dernière publiée : 1.' + UPD.latest : ''}</p>
    <div class="row wrap">${updAvailable() ? '<button class="btn pri" id="doUpd2">Mettre à jour</button>' : ''}<button class="btn" id="chkUpd">Vérifier les mises à jour</button></div>
    <p class="mute xs" style="margin-bottom:0">Les améliorations de l’appli arrivent toutes seules. Une réinstallation n’est demandée que pour les changements de la partie Android.</p></div>` : ''}
  <div class="card"><h2>Affichage du journal</h2>
    <select data-k="journalView" data-str><option value="repas" ${s.journalView !== 'heure' ? 'selected' : ''}>Par repas</option><option value="heure" ${s.journalView === 'heure' ? 'selected' : ''}>Par heure</option></select>
    <p class="mute xs" style="margin-bottom:0">Le total des calories et des macros s’affiche en face de chaque repas ou de chaque heure.</p></div>
  <div class="card"><h2>Rappel des mensurations</h2>
    <div class="grid2"><div><label>Jour</label><select data-k="measDay"><option value="-1" ${s.measDay < 0 ? 'selected' : ''}>Désactivé</option><option value="6" ${s.measDay == 6 ? 'selected' : ''}>Samedi</option><option value="0" ${s.measDay == 0 ? 'selected' : ''}>Dimanche</option></select></div>
    <div><label>Heure</label><input type="time" data-k="measTime" data-str value="${esc(s.measTime || '09:00')}"></div></div>
    <p class="mute xs" style="margin-bottom:0">${NATIVE ? esc(REM.status || 'Une notification arrive chaque semaine sur le téléphone.') : 'Notification sur l’appli Android ; ici, une carte s’affiche dans le journal ce jour-là.'}</p></div>
  <div class="card"><h2>Photo IA</h2><label>Clé API Anthropic</label><input type="password" data-k="apiKey" data-str value="${esc(s.apiKey)}" placeholder="sk-ant-…" autocomplete="off">
    <label style="margin-top:8px">Modèle</label><input data-k="model" data-str value="${esc(s.model)}">
    <p class="mute">La clé reste dans ce navigateur. Elle se crée sur console.anthropic.com.</p></div>
  <div class="card"><h2>Sauvegarde</h2><p class="mute">Copie complète de tes données, en plus de la synchronisation.</p>
    <div class="row wrap">${NATIVE ? '' : '<button class="btn pri" id="exp">Exporter (.json)</button>'}<button class="btn" id="imp">Importer une sauvegarde</button><button class="btn danger" id="reset">Tout effacer</button></div></div>
  <div class="card"><h2>Repas habituels (${S.meals.length})</h2>${S.meals.map((m, i) => `<div class="entry"><div>${esc(m.name)}<div class="mute">${r0(m.items.reduce((s, e) => s + (+e.kcal || 0), 0))} kcal</div></div><button class="btn sm danger" data-delm="${i}">×</button></div>`).join('') || '<p class="mute">Aucun. Enregistre-en un depuis le bouton ⋯ d’un repas.</p>'}</div>
  <div class="card"><h2>Mes aliments (${S.foods.length})</h2>${S.foods.map((f, i) => `<div class="entry"><div>${esc(f.name)}<div class="mute">${r0(f.per.kcal)} kcal / 100 g</div></div><button class="btn sm danger" data-del="${i}">×</button></div>`).join('') || '<p class="mute">Aucun.</p>'}</div>`;
  bindSettings();
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { S.foods.splice(+b.dataset.del, 1); save(); render(); });
  document.querySelectorAll('[data-delm]').forEach(b => b.onclick = () => { S.meals.splice(+b.dataset.delm, 1); save(); render(); });
  document.querySelectorAll('[data-cfg]').forEach(el => el.onchange = () => {
    const k = el.dataset.cfg, v = el.value.trim();
    if (k !== 'token' && CFG[k] !== v) { META = { base: {}, sha: {}, lastSync: 0, error: '' }; saveMeta(); }
    CFG[k] = v; saveCfg(); sync();
  });
  $('#syncNow').onclick = () => sync();
  if ($('#doUpd2')) $('#doUpd2').onclick = doUpdate;
  if ($('#chkUpd')) $('#chkUpd').onclick = () => { toast('Vérification…'); checkUpdate(true).then(() => toast(updAvailable() ? 'Une mise à jour est disponible' : 'L’appli est à jour')); };
  if ($('#exp')) $('#exp').onclick = () => {
    const blob = new Blob([JSON.stringify(S)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `carnet-nutrition-${today()}.json`; a.click();
  };
  $('#imp').onclick = () => { const f = $('#fileJson'); f.value = ''; f.click(); };
  $('#reset').onclick = () => {
    openSheet(`<h3>Tout effacer ?</h3><p>Journal, pesées, aliments et import MacroFactor seront supprimés de ce navigateur.</p><div class="row"><button class="btn danger" id="yes">Effacer</button><button class="btn" id="no">Annuler</button></div>`);
    $('#yes').onclick = () => { S = defaults(); save(); closeSheet(); }; $('#no').onclick = closeSheet;
  };
}
function bindSettings() {
  document.querySelectorAll('[data-k]').forEach(el => el.onchange = () => {
    const k = el.dataset.k; S.settings[k] = el.hasAttribute('data-str') ? el.value.trim() : (num(el.value) ?? 0); save();
    if (k === 'measDay' || k === 'measTime') { scheduleReminder(true).then(() => { if (tab === 'reglages') render(); }); return; }
    if (tab === 'depense') render(); else toast('Enregistré');
  });
}

/* ===================== Démarrage ===================== */
if (typeof document !== 'undefined' && document.getElementById('main')) {
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); window.scrollTo(0, 0); });
  $('#todayBtn').onclick = () => { if (selMode) exitSel(false); cur = today(); render(); };
  $('#selCancel').onclick = () => exitSel();
  $('#selAll').onclick = () => { const es = (S.days[cur] && S.days[cur].entries) || []; sel = sel.size === es.length ? new Set() : new Set(es.map(e => e.id)); render(); };
  $('#selDel').onclick = selDelete; $('#selCopy').onclick = openSelCopy; $('#selMove').onclick = openSelMove;
  $('#fab').innerHTML = IC.plus; $('#fab').onclick = () => openAdd(null);
  $('#sheet').onclick = e => { if (e.target.id === 'sheet') { if (sheetMode === 'editor') ingDraft = null; closeSheet(); } };
  $('#sx').onclick = () => { if (sheetMode === 'editor') ingDraft = null; closeSheet(); };
  $('#filePhoto').onchange = e => { if (e.target.files[0]) analysePhoto(e.target.files[0]); };
  $('#fileMF').onchange = e => { if (e.target.files[0]) importMF(e.target.files[0]).catch(err => toast('Import impossible : ' + err.message, 4000)); };
  $('#fileJson').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const o = JSON.parse(await f.text()); if (!o.days) throw new Error('fichier non reconnu'); const d = defaults(); S = { ...d, ...o, settings: { ...d.settings, ...o.settings } }; save(); render(); toast('Sauvegarde restaurée'); }
    catch (err) { toast('Import impossible : ' + err.message); }
  };
  render();
  setSync(CFG.token ? '' : '', CFG.token ? '' : 'Sur cet appareil seulement');
  if (CFG.token) sync();
  if (NATIVE) {
    scheduleReminder(true);
    checkUpdate();
    try { const ln = nativeLN(); ln && ln.addListener && ln.addListener('localNotificationActionPerformed', a => { if (a && a.notification && a.notification.id === 7) { tab = 'poids'; cur = today(); render(); } }); } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') scheduleSync(300); });
  window.addEventListener('online', () => scheduleSync(300));
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
