name: Appli Android (APK)

on:
  push:
    branches: [main]
    paths: ["apk/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Préparer le projet Android
        working-directory: apk
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#14181d' --iconBackgroundColorDark '#14181d' --splashBackgroundColor '#14181d' --splashBackgroundColorDark '#14181d' || echo "::warning::Icônes non générées, icône Capacitor par défaut"
          npx cap sync android
          # Activité principale personnalisée (marges barre d'état / navigation)
          MA=$(find android/app/src/main/java -name MainActivity.java)
          cp android-src/MainActivity.java "$MA"
          head -3 "$MA"
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q android.permission.CAMERA "$MANIFEST" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>#' "$MANIFEST"
          grep -q POST_NOTIFICATIONS "$MANIFEST" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' "$MANIFEST"
          grep -q SCHEDULE_EXACT_ALARM "$MANIFEST" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n</manifest>#' "$MANIFEST"
          grep -q USE_EXACT_ALARM "$MANIFEST" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n</manifest>#' "$MANIFEST"
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]+\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          grep -E "uses-permission" "$MANIFEST"

      - name: Compiler
        working-directory: apk/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Signer
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 apk/android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > signature.jks
            PASS="$KEYSTORE_PASSWORD"
          else
            echo "::warning::Pas de secret KEYSTORE_BASE64 : clé temporaire, il faudra désinstaller l'appli avant chaque mise à jour."
            PASS=temporaire
            keytool -genkeypair -keystore signature.jks -alias carnet -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Carnet nutrition"
          fi
          "$BT/apksigner" sign --ks signature.jks --ks-pass "pass:$PASS" --ks-key-alias carnet --out carnet-nutrition.apk aligned.apk
          rm -f signature.jks
          "$BT/apksigner" verify carnet-nutrition.apk

      - name: Publier dans les Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android carnet-nutrition.apk \
            --target "${{ github.sha }}" \
            --title "Appli Android — version 1.${{ github.run_number }}" \
            --notes "Télécharge carnet-nutrition.apk sur ton téléphone et ouvre-le pour l'installer. L'appli charge le carnet nutrition depuis GitHub Pages : les améliorations de l'appli arrivent sans réinstaller."
